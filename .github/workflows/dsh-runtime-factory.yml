name: DSH Runtime Factory

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact @deepseek-ai/dsh version to rebuild
        required: false
        type: string
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: dsh-runtime-factory-${{ github.repository }}
  cancel-in-progress: false

env:
  RUNTIME_PLATFORM: win32
  RUNTIME_ARCH: x64
  NODE_VERSION: '24.18.0'
  PNPM_VERSION: '11.7.0'
  FACTORY_PERFORMANCE_ACCEPTED: 'false'

jobs:
  schedule-gate:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    outputs:
      run_factory: ${{ steps.gate.outputs.run_factory }}
    steps:
      - name: Set up Node.js for cheap schedule detection
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Gate scheduled Factory while performance acceptance is open
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (npm view @deepseek-ai/dsh dist-tags.latest).Trim()
          $tag = "dsh-runtime-v$version"
          if ($env:FACTORY_PERFORMANCE_ACCEPTED -ne 'true') {
            "run_factory=false" >> $env:GITHUB_OUTPUT
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Scheduled Factory skipped`n- Version: $version`n- Reason: FACTORY_PERFORMANCE_ACCEPTED=false; artifact-only benchmark is required first"
            exit 0
          }
          $releaseJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>&1
          if ($LASTEXITCODE -eq 0) {
            "run_factory=false" >> $env:GITHUB_OUTPUT
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Scheduled Factory no-op`n- Version: $version`n- Reason: candidate $tag already exists; expensive rebuild is not required"
            exit 0
          }
          if ([string]$releaseJson -notmatch '404|Not Found') { throw "Unable to perform cheap candidate detection: $releaseJson" }
          "run_factory=true" >> $env:GITHUB_OUTPUT

  factory:
    needs: schedule-gate
    if: always() && (github.event_name != 'schedule' || needs.schedule-gate.outputs.run_factory == 'true')
    runs-on: windows-latest
    steps:
      - name: Set up Node.js before registry resolution
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve version and validate existing candidate preflight
        id: resolve
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          "CURRENT_PHASE=resolve" >> $env:GITHUB_ENV
          "FACTORY_STATUS=not_run" >> $env:GITHUB_ENV
          "PUBLISH_STATUS=not_run" >> $env:GITHUB_ENV
          "REMOTE_VERIFY_STATUS=not_run" >> $env:GITHUB_ENV
          "MARKER_STATUS=not_run" >> $env:GITHUB_ENV
          "CLI_STATUS=not_run" >> $env:GITHUB_ENV
          "WEB_STATUS=not_run" >> $env:GITHUB_ENV
          "HEALTH_STATUS=not_run" >> $env:GITHUB_ENV
          "NATIVE_STATUS=not_run" >> $env:GITHUB_ENV
          $version = $env:MANUAL_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { $version = (npm view @deepseek-ai/dsh dist-tags.latest).Trim() }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') { throw "Resolved version is not an exact SemVer: $version" }
          "RUNTIME_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          $tag = "dsh-runtime-v$version"
          $zipName = "dsh-runtime-$version-win32-x64.zip"
          $indexName = 'runtime-index.json'
          $expectedUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$zipName"
          $sourceRefs = git ls-remote 'https://github.com/deepseek-ai/deepseek-harness.git' "refs/tags/dsh-v$version" "refs/tags/dsh-v$version^{}"
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve exact upstream tag dsh-v$version" }
          $peeled = @($sourceRefs | Where-Object { $_ -match "^([0-9a-f]{40})\s+refs/tags/dsh-v$version\^\{\}$" })
          $direct = @($sourceRefs | Where-Object { $_ -match "^([0-9a-f]{40})\s+refs/tags/dsh-v$version$" })
          $sourceCommit = if ($peeled.Count -gt 0) { $peeled[0].Split()[0] } elseif ($direct.Count -gt 0) { $direct[0].Split()[0] } else { $null }
          if ([string]::IsNullOrWhiteSpace($sourceCommit) -or $sourceCommit -notmatch '^[0-9a-f]{40}$') { throw "Exact upstream tag dsh-v$version is absent; no master fallback is permitted" }
          "EXPECTED_SOURCE_COMMIT=$sourceCommit" >> $env:GITHUB_ENV
          $releaseError = ''
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>&1
          if ($LASTEXITCODE -ne 0) {
            $releaseError = [string]$releaseJson
            if ($releaseError -notmatch '404|Not Found') { throw "Unable to read candidate Release: $releaseError" }
            $releaseJson = $null
          }
          $LASTEXITCODE = 0
          if ($releaseJson) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.tag_name -ne $tag) { throw "Release tag mismatch: $($release.tag_name)" }
            if ($release.draft -ne $false -or $release.prerelease -ne $true) { throw "Existing Release is not an immutable prerelease candidate: $tag" }
            "RELEASE_PRESENT=true" >> $env:GITHUB_ENV
            $zipAsset = @($release.assets | Where-Object { $_.name -eq $zipName })
            $indexAsset = @($release.assets | Where-Object { $_.name -eq $indexName })
            if ($zipAsset.Count -gt 1 -or $indexAsset.Count -gt 1) { throw 'Release contains duplicate expected assets' }
            if ($zipAsset.Count -eq 1 -and $indexAsset.Count -eq 1) {
              $preflight = Join-Path $env:RUNNER_TEMP "dsh-preflight-$version"
              New-Item -ItemType Directory -Force $preflight | Out-Null
              $remoteZip = Join-Path $preflight $zipName
              $remoteIndex = Join-Path $preflight $indexName
              Invoke-WebRequest -Uri $zipAsset[0].browser_download_url -OutFile $remoteZip
              Invoke-WebRequest -Uri $indexAsset[0].browser_download_url -OutFile $remoteIndex
              $index = Get-Content $remoteIndex -Raw | ConvertFrom-Json
              if ($index.schemaVersion -ne 1 -or @($index.artifacts).Count -ne 1) { throw 'Existing runtime-index.json is not schema v1 with one artifact' }
              $entry = $index.artifacts[0]
              if ($entry.version -ne $version -or $entry.platform -ne 'win32' -or $entry.arch -ne 'x64') { throw 'Existing candidate identity does not match version/target' }
              if ($entry.artifactUrl -ne $expectedUrl -or $entry.artifactUrl -notmatch '^https://') { throw 'Existing candidate artifact URL is not the expected HTTPS URL' }
              if ($entry.sha256 -notmatch '^[a-f0-9]{64}$' -or $entry.sizeBytes -le 0) { throw 'Existing candidate hash or size is invalid' }
              $zipHash = (Get-FileHash $remoteZip -Algorithm SHA256).Hash.ToLowerInvariant()
              $zipSize = (Get-Item $remoteZip).Length
              if ($zipHash -ne $entry.sha256 -or $zipSize -ne $entry.sizeBytes) { throw 'Existing candidate ZIP identity conflicts with runtime-index.json' }
              $sourceCommitMatch = [regex]::Match($release.body, 'SOURCE_COMMIT=([0-9a-f]{40})')
              if ($release.body -notmatch "SOURCE_TAG=dsh-v$version" -or -not $sourceCommitMatch.Success -or $sourceCommitMatch.Groups[1].Value -ne $env:EXPECTED_SOURCE_COMMIT) { throw 'Existing candidate source/tag identity does not match the exact upstream tag commit' }
              "CURRENT_PHASE=release-marker" >> $env:GITHUB_ENV
              "MARKER_STATUS=running" >> $env:GITHUB_ENV
              $marker = 'REMOTE_VERIFY=REMOTE_VERIFIED'
              $existingBody = [string]$release.body
              if ($existingBody -notmatch [regex]::Escape($marker)) {
                $body = "$($existingBody.TrimEnd())`n$marker"
                gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" --raw-field "body=$body" | Out-Null
                if ($LASTEXITCODE -ne 0) { throw 'Unable to persist the remote verification marker on the candidate Release' }
              }
              $markedRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
              $markedCommitMatch = [regex]::Match([string]$markedRelease.body, 'SOURCE_COMMIT=([0-9a-f]{40})')
              if ([string]$markedRelease.body -notmatch [regex]::Escape($marker) -or [string]$markedRelease.body -notmatch "SOURCE_TAG=dsh-v$version" -or -not $markedCommitMatch.Success -or $markedCommitMatch.Groups[1].Value -ne $env:EXPECTED_SOURCE_COMMIT) { throw 'Candidate Release marker or source identity readback is invalid' }
              "MARKER_STATUS=passed" >> $env:GITHUB_ENV
              "REMOTE_VERIFY=REMOTE_VERIFIED" >> $env:GITHUB_ENV
              "VALIDATED_NOOP=true" >> $env:GITHUB_ENV
              "CANDIDATE_STATUS=VALIDATED_CANDIDATE_NOOP" >> $env:GITHUB_ENV
              "skip=true" >> $env:GITHUB_OUTPUT
              "RELEASE_STATUS=VALIDATED_CANDIDATE" >> $env:GITHUB_ENV
              "REMOTE_VERIFY_STATUS=passed" >> $env:GITHUB_ENV
              "PUBLISH_STATUS=passed" >> $env:GITHUB_ENV
              "resolve_status=passed" >> $env:GITHUB_OUTPUT
              exit 0
            }
            "skip=false" >> $env:GITHUB_OUTPUT
          } else {
            "RELEASE_PRESENT=false" >> $env:GITHUB_ENV
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          "resolve_status=passed" >> $env:GITHUB_OUTPUT

      - name: Checkout Desktop workflow repository
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: steps.resolve.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Desktop distribution dependencies
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "CURRENT_PHASE=workflow-dependencies" >> $env:GITHUB_ENV
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Checkout exact upstream source tag
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v${{ env.RUNTIME_VERSION }}
          path: upstream
          fetch-depth: 1

      - name: Build upstream CLI and Web assets
        if: steps.resolve.outputs.skip != 'true'
        working-directory: upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "CURRENT_PHASE=upstream-build" >> $env:GITHUB_ENV
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Deploy isolated production DSH package
        if: steps.resolve.outputs.skip != 'true'
        working-directory: upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "CURRENT_PHASE=runtime-deploy" >> $env:GITHUB_ENV
          if (Test-Path factory-runtime) { Remove-Item -Recurse -Force factory-runtime }
          pnpm --filter @deepseek-ai/dsh deploy --legacy --prod factory-runtime
          if (-not (Test-Path 'factory-runtime/package.json')) { throw 'Isolated DSH production package was not created' }

      - name: Complete isolated DSH peer dependency closure
        if: steps.resolve.outputs.skip != 'true'
        working-directory: upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const runtime = path.join(root, 'factory-runtime');
          const workspacePackages = new Map();
          const packageFiles = [];
          const runtimePackageFiles = [];
          function walk(current, output, visited = new Set()) {
            const realCurrent = fs.realpathSync(current);
            if (visited.has(realCurrent)) return;
            visited.add(realCurrent);
            for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
              if (entry.name === '.git' || (output === packageFiles && (entry.name === 'node_modules' || entry.name === 'factory-runtime'))) continue;
              const absolute = path.join(current, entry.name);
              const stat = fs.statSync(absolute);
              if (stat.isDirectory()) walk(absolute, output, visited);
              else if (stat.isFile() && entry.name === 'package.json') output.push(absolute);
            }
          }
          walk(root, packageFiles);
          walk(runtime, runtimePackageFiles);
          for (const file of packageFiles) {
            const packageJson = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (packageJson.name) workspacePackages.set(packageJson.name, path.dirname(file));
          }
          const peers = new Set();
          for (const file of runtimePackageFiles) {
            const packageJson = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const field of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
              for (const name of Object.keys(packageJson[field] || {})) peers.add(name);
            }
          }
          function linkRuntimeTree(source, destination) {
            const stat = fs.lstatSync(source);
            if (stat.isSymbolicLink()) throw new Error(`Workspace runtime file must not be a symlink: ${source}`);
            if (stat.isDirectory()) {
              fs.mkdirSync(destination, { recursive: true });
              for (const entry of fs.readdirSync(source, { withFileTypes: true })) {
                linkRuntimeTree(path.join(source, entry.name), path.join(destination, entry.name));
              }
              return;
            }
            if (!stat.isFile()) throw new Error(`Unsupported workspace runtime entry: ${source}`);
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            fs.linkSync(source, destination);
          }
          function stageWorkspacePackage(source, destination) {
            fs.mkdirSync(destination, { recursive: true });
            linkRuntimeTree(path.join(source, 'package.json'), path.join(destination, 'package.json'));
            for (const entry of ['lib', 'config', 'dist', 'bin']) {
              const sourceEntry = path.join(source, entry);
              if (fs.existsSync(sourceEntry)) linkRuntimeTree(sourceEntry, path.join(destination, entry));
            }
          }
          const deployedPackages = new Map();
          function rememberDeployedPackage(name, directory) {
            if (!deployedPackages.has(name)) deployedPackages.set(name, directory);
          }
          const pnpmRoot = path.join(runtime, 'node_modules', '.pnpm');
          if (fs.existsSync(pnpmRoot)) {
            for (const entry of fs.readdirSync(pnpmRoot, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const packageRoot = path.join(pnpmRoot, entry.name, 'node_modules');
              if (!fs.existsSync(packageRoot)) continue;
              for (const packageEntry of fs.readdirSync(packageRoot, { withFileTypes: true })) {
                if (packageEntry.name.startsWith('@')) {
                  const scopeRoot = path.join(packageRoot, packageEntry.name);
                  for (const scopedEntry of fs.readdirSync(scopeRoot, { withFileTypes: true })) {
                    if (scopedEntry.isDirectory() || scopedEntry.isSymbolicLink()) {
                      rememberDeployedPackage(`${packageEntry.name}/${scopedEntry.name}`, path.join(scopeRoot, scopedEntry.name));
                    }
                  }
                } else if (packageEntry.isDirectory() || packageEntry.isSymbolicLink()) {
                  rememberDeployedPackage(packageEntry.name, path.join(packageRoot, packageEntry.name));
                }
              }
            }
          }
          function findDeployedPackage(name) {
            return deployedPackages.get(name) || null;
          }
          let linked = 0;
          for (const name of [...peers].sort()) {
            const destination = path.join(runtime, 'node_modules', ...name.split('/'));
            if (fs.existsSync(destination)) continue;
            const target = workspacePackages.get(name) || path.join(root, 'node_modules', ...name.split('/'));
            const deployedTarget = findDeployedPackage(name);
            const resolvedTarget = fs.existsSync(target) ? target : deployedTarget;
            if (!resolvedTarget || !fs.existsSync(resolvedTarget)) continue;
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            if (workspacePackages.has(name)) stageWorkspacePackage(target, destination);
            else fs.symlinkSync(resolvedTarget, destination, 'junction');
            linked += 1;
          }
          const required = '@deepseek-ai/cordis-plugin-group';
          if (!fs.existsSync(path.join(runtime, 'node_modules', ...required.split('/')))) {
            throw new Error(`Required peer dependency was not materialized: ${required}`);
          }
          process.stdout.write(JSON.stringify({ linkedPeerDependencies: linked }) + '\n');
          '@
          $script | node -

      - name: Smoke isolated production DSH CLI
        if: steps.resolve.outputs.skip != 'true'
        working-directory: upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = node factory-runtime/lib/bin.js --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Isolated DSH CLI --version failed: $output" }
          if ($output -notmatch [regex]::Escape($env:RUNTIME_VERSION)) { throw "Isolated DSH CLI version mismatch: $output" }

      - name: Verify upstream layout and exact package version
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('upstream/apps/cli', 'upstream/apps/web/dist', 'upstream/apps/web/package.json')
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Required upstream path is missing: $path" } }
          $package = Get-Content 'upstream/apps/cli/package.json' -Raw | ConvertFrom-Json
          $webPackage = Get-Content 'upstream/apps/web/package.json' -Raw | ConvertFrom-Json
          if ($package.version -ne $env:RUNTIME_VERSION -or $webPackage.version -ne $env:RUNTIME_VERSION) { throw 'Upstream package version mismatch' }
          if ((git -C upstream rev-parse HEAD).Trim() -ne $env:EXPECTED_SOURCE_COMMIT) { throw 'Checked out upstream commit does not match exact resolved tag commit' }
          "SOURCE_TAG=dsh-v$env:RUNTIME_VERSION" >> $env:GITHUB_ENV
          "SOURCE_COMMIT=$(git -C upstream rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Validate distribution workflow
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "CURRENT_PHASE=workflow-validation" >> $env:GITHUB_ENV
          node scripts/runtime-distribution/runtime-distribution-cli.js validate-workflows

      - name: Build verified Windows x64 runtime artifact
        id: factory
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "CURRENT_PHASE=factory" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $url = "https://github.com/${{ github.repository }}/releases/download/dsh-runtime-v$env:RUNTIME_VERSION/dsh-runtime-$env:RUNTIME_VERSION-win32-x64.zip"
          $resultPath = 'artifacts/factory-result.json'
          $resultText = node scripts/build-verified-runtime-artifact.js --source-runtime upstream/factory-runtime --frontend-dist upstream/apps/web/dist --frontend-package-json upstream/apps/web/package.json --output artifacts --version $env:RUNTIME_VERSION --platform $env:RUNTIME_PLATFORM --arch $env:RUNTIME_ARCH --artifact-url $url --source-revision $env:SOURCE_COMMIT --pnpm-version $env:PNPM_VERSION --archive-mode direct 2> artifacts/factory.log | Tee-Object $resultPath | Out-String
          $nodeExitCode = $LASTEXITCODE
          if ($nodeExitCode -ne 0) { throw "Verified runtime Factory failed with exit code $nodeExitCode" }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          "FACTORY_STATUS=passed" >> $env:GITHUB_ENV
          "CLI_STATUS=passed" >> $env:GITHUB_ENV
          "WEB_STATUS=passed" >> $env:GITHUB_ENV
          "HEALTH_STATUS=passed" >> $env:GITHUB_ENV
          "NATIVE_STATUS=passed" >> $env:GITHUB_ENV
          "ARTIFACT_VERSION=$($result.indexEntry.version)" >> $env:GITHUB_ENV
          "ARTIFACT_SHA256=$($result.indexEntry.sha256)" >> $env:GITHUB_ENV
          "ARTIFACT_SIZE=$($result.indexEntry.sizeBytes)" >> $env:GITHUB_ENV
          "factory_status=passed" >> $env:GITHUB_OUTPUT

      - name: Publish or reconcile immutable candidate Release assets
        id: publish
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          "CURRENT_PHASE=publish" >> $env:GITHUB_ENV
          $tag = "dsh-runtime-v$env:RUNTIME_VERSION"
          $zip = "artifacts/dsh-runtime-$env:RUNTIME_VERSION-win32-x64.zip"
          $index = 'artifacts/runtime-index.json'
          $expectedUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/dsh-runtime-$env:RUNTIME_VERSION-win32-x64.zip"
          $indexValue = Get-Content $index -Raw | ConvertFrom-Json
          if ($indexValue.schemaVersion -ne 1 -or @($indexValue.artifacts).Count -ne 1) { throw 'Factory runtime-index.json is not schema v1 with one artifact' }
          $entry = $indexValue.artifacts[0]
          if ($entry.version -ne $env:RUNTIME_VERSION -or $entry.platform -ne 'win32' -or $entry.arch -ne 'x64' -or $entry.artifactUrl -ne $expectedUrl -or $entry.artifactUrl -notmatch '^https://') { throw 'Factory artifact metadata identity is invalid' }
          $localHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $localSize = (Get-Item $zip).Length
          if ($entry.sha256 -ne $localHash -or $entry.sizeBytes -ne $localSize) { throw 'Factory ZIP does not match runtime-index.json' }
          $releaseError = ''
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>&1
          if ($LASTEXITCODE -ne 0) {
            $releaseError = [string]$releaseJson
            if ($releaseError -notmatch '404|Not Found') { throw "Unable to read candidate Release: $releaseError" }
            $releaseJson = $null
          }
          if (-not $releaseJson) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "DSH runtime $env:RUNTIME_VERSION" --notes "SOURCE_TAG=dsh-v$env:RUNTIME_VERSION`nSOURCE_COMMIT=$env:SOURCE_COMMIT`nCANDIDATE_PUBLISHED" --prerelease
            $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.tag_name -ne $tag -or $release.draft -ne $false -or $release.prerelease -ne $true) { throw 'Release state is stale, draft, or non-prerelease' }
          $sourceCommitMatch = [regex]::Match($release.body, 'SOURCE_COMMIT=([0-9a-f]{40})')
          if ($release.body -notmatch "SOURCE_TAG=dsh-v$env:RUNTIME_VERSION" -or -not $sourceCommitMatch.Success -or $sourceCommitMatch.Groups[1].Value -ne $env:EXPECTED_SOURCE_COMMIT) { throw 'Existing Release source/tag identity does not match the exact upstream tag commit' }
          foreach ($localPath in @($zip, $index)) {
            $name = Split-Path $localPath -Leaf
            $remote = @($release.assets | Where-Object { $_.name -eq $name })
            if ($remote.Count -gt 1) { throw "Release contains duplicate asset: $name" }
            if ($remote.Count -eq 1) {
              $probe = Join-Path $env:RUNNER_TEMP "candidate-$name"
              Invoke-WebRequest -Uri $remote[0].browser_download_url -OutFile $probe
              $remoteHash = (Get-FileHash $probe -Algorithm SHA256).Hash.ToLowerInvariant()
              $remoteSize = (Get-Item $probe).Length
              if ($remoteHash -ne (Get-FileHash $localPath -Algorithm SHA256).Hash.ToLowerInvariant() -or $remoteSize -ne (Get-Item $localPath).Length) { throw "Immutable asset conflict: $name" }
            } else { gh release upload $tag $localPath --repo $env:GITHUB_REPOSITORY }
          }
          $final = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          foreach ($name in @((Split-Path $zip -Leaf), $index)) {
            $asset = @($final.assets | Where-Object { $_.name -eq $name })
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded') { throw "Expected immutable asset is missing after publish: $name" }
          }
          "PUBLISH_STATUS=passed" >> $env:GITHUB_ENV
          "REMOTE_PUBLISH=CANDIDATE_PUBLISHED" >> $env:GITHUB_ENV
          "publish_status=passed" >> $env:GITHUB_OUTPUT

      - name: Verify remote candidate metadata and ZIP readback
        id: remote
        if: steps.resolve.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          "CURRENT_PHASE=remote-readback" >> $env:GITHUB_ENV
          $tag = "dsh-runtime-v$env:RUNTIME_VERSION"
          $zipName = "dsh-runtime-$env:RUNTIME_VERSION-win32-x64.zip"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($release.tag_name -ne $tag -or $release.draft -ne $false -or $release.prerelease -ne $true) { throw 'Remote Release state is invalid' }
          $sourceCommitMatch = [regex]::Match($release.body, 'SOURCE_COMMIT=([0-9a-f]{40})')
          if ($release.body -notmatch "SOURCE_TAG=dsh-v$env:RUNTIME_VERSION" -or -not $sourceCommitMatch.Success -or $sourceCommitMatch.Groups[1].Value -ne $env:EXPECTED_SOURCE_COMMIT) { throw 'Remote source/tag identity is invalid' }
          $root = Join-Path $env:RUNNER_TEMP "remote-$env:RUNTIME_VERSION"
          New-Item -ItemType Directory -Force $root | Out-Null
          $zipAsset = @($release.assets | Where-Object { $_.name -eq $zipName })
          $indexAsset = @($release.assets | Where-Object { $_.name -eq 'runtime-index.json' })
          if ($zipAsset.Count -ne 1 -or $indexAsset.Count -ne 1) { throw 'Remote readback is missing an expected asset' }
          $remoteZip = Join-Path $root $zipName
          $remoteIndex = Join-Path $root 'runtime-index.json'
          Invoke-WebRequest -Uri $zipAsset[0].browser_download_url -OutFile $remoteZip
          Invoke-WebRequest -Uri $indexAsset[0].browser_download_url -OutFile $remoteIndex
          $index = Get-Content $remoteIndex -Raw | ConvertFrom-Json
          $entry = $index.artifacts[0]
          $expectedUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$zipName"
          if ($index.schemaVersion -ne 1 -or @($index.artifacts).Count -ne 1 -or $entry.version -ne $env:RUNTIME_VERSION -or $entry.platform -ne 'win32' -or $entry.arch -ne 'x64' -or $entry.artifactUrl -ne $expectedUrl -or $entry.artifactUrl -notmatch '^https://') { throw 'Remote runtime-index identity is invalid' }
          $hash = (Get-FileHash $remoteZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $remoteZip).Length
          if ($hash -ne $entry.sha256 -or $size -ne $entry.sizeBytes) { throw 'Remote ZIP hash or size conflicts with runtime-index.json' }
          "REMOTE_VERIFY_STATUS=passed" >> $env:GITHUB_ENV
          "REMOTE_VERIFY=REMOTE_VERIFIED" >> $env:GITHUB_ENV
          "remote_status=passed" >> $env:GITHUB_OUTPUT

      - name: Persist durable remote verification marker
        id: marker
        if: steps.resolve.outputs.skip != 'true' && steps.remote.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          "CURRENT_PHASE=release-marker" >> $env:GITHUB_ENV
          "MARKER_STATUS=running" >> $env:GITHUB_ENV
          $tag = "dsh-runtime-v$env:RUNTIME_VERSION"
          $marker = 'REMOTE_VERIFY=REMOTE_VERIFIED'
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          $sourceCommitMatch = [regex]::Match([string]$release.body, 'SOURCE_COMMIT=([0-9a-f]{40})')
          if ([string]$release.body -notmatch "SOURCE_TAG=dsh-v$env:RUNTIME_VERSION" -or -not $sourceCommitMatch.Success -or $sourceCommitMatch.Groups[1].Value -ne $env:EXPECTED_SOURCE_COMMIT) { throw 'Release source identity changed before marker persistence' }
          $existingBody = [string]$release.body
          if ($existingBody -notmatch [regex]::Escape($marker)) {
            $body = "$($existingBody.TrimEnd())`n$marker"
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" --raw-field "body=$body" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Unable to persist the remote verification marker on the candidate Release' }
          }
          $markedRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          $markedCommitMatch = [regex]::Match([string]$markedRelease.body, 'SOURCE_COMMIT=([0-9a-f]{40})')
          if ([string]$markedRelease.body -notmatch [regex]::Escape($marker) -or [string]$markedRelease.body -notmatch "SOURCE_TAG=dsh-v$env:RUNTIME_VERSION" -or -not $markedCommitMatch.Success -or $markedCommitMatch.Groups[1].Value -ne $env:EXPECTED_SOURCE_COMMIT) { throw 'Release marker or source identity readback is invalid' }
          "MARKER_STATUS=passed" >> $env:GITHUB_ENV
          "REMOTE_VERIFY=REMOTE_VERIFIED" >> $env:GITHUB_ENV

      - name: Write failure-derived factory summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $isNoop = $env:VALIDATED_NOOP -eq 'true' -and $env:REMOTE_VERIFY_STATUS -eq 'passed' -and $env:MARKER_STATUS -eq 'passed'
          $allSucceeded = $env:FACTORY_STATUS -eq 'passed' -and $env:PUBLISH_STATUS -eq 'passed' -and $env:REMOTE_VERIFY_STATUS -eq 'passed' -and $env:MARKER_STATUS -eq 'passed' -and $env:CLI_STATUS -eq 'passed' -and $env:WEB_STATUS -eq 'passed' -and $env:HEALTH_STATUS -eq 'passed' -and $env:NATIVE_STATUS -eq 'passed'
          if ($isNoop) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## DSH Runtime Factory`n- Version: $env:RUNTIME_VERSION`n- Candidate: VALIDATED_CANDIDATE_NOOP`n- Remote verify: passed`n- Status: no-op; promotion state unchanged"
          } elseif ($allSucceeded) {
            $summary = @"
            ## DSH Runtime Factory
            - Upstream version: $env:RUNTIME_VERSION
            - Source tag/commit: $env:SOURCE_TAG / $env:SOURCE_COMMIT
            - Artifact version/hash/size: $env:ARTIFACT_VERSION / $env:ARTIFACT_SHA256 / $env:ARTIFACT_SIZE
            - CLI: $env:CLI_STATUS
            - Web: $env:WEB_STATUS
            - Health: $env:HEALTH_STATUS
            - Native: $env:NATIVE_STATUS
            - Remote publish: $env:REMOTE_PUBLISH
            - Remote verify: $env:REMOTE_VERIFY
            - Status: WAITING_FOR_PROMOTION
          "@
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
            @{ version=$env:RUNTIME_VERSION; sourceTag=$env:SOURCE_TAG; sourceCommit=$env:SOURCE_COMMIT; artifactVersion=$env:ARTIFACT_VERSION; sha256=$env:ARTIFACT_SHA256; sizeBytes=$env:ARTIFACT_SIZE; remotePublish=$env:REMOTE_PUBLISH; remoteVerify=$env:REMOTE_VERIFY; status='WAITING_FOR_PROMOTION' } | ConvertTo-Json | Set-Content artifacts/factory-metadata.json
          } else {
            $failedPhase = if ($env:CURRENT_PHASE) { $env:CURRENT_PHASE } else { 'unknown' }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## DSH Runtime Factory FAILED`n- Failed phase: $failedPhase`n- Factory: $env:FACTORY_STATUS`n- Publish: $env:PUBLISH_STATUS`n- Remote verify: $env:REMOTE_VERIFY_STATUS`n- Release marker: $env:MARKER_STATUS`n- Promotion readiness: NOT_READY"
          }

      - name: Upload factory logs and metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-runtime-factory-${{ env.RUNTIME_VERSION }}
          path: |
            artifacts/factory.log
            artifacts/factory-result.json
            artifacts/factory-metadata.json
          if-no-files-found: ignore
