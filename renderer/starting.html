<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="splash">
  <div class="splash-box">
    <img class="logo" src="../assets/icon.png" alt="DeepSeek Harness" />
    <h1>DeepSeek Harness</h1>
    <div class="spinner"></div>
    <p id="status" class="status">正在启动 DeepSeek Harness...</p>
  </div>
  <script>
    // First-paint observability: report DOM ready + the first animation frame
    // back to the main process via console (captured by console-message).
    (function () {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          console.log('[splash] domcontentloaded');
        });
      } else {
        console.log('[splash] domcontentloaded');
      }
      window.addEventListener('load', function () { console.log('[splash] load'); });
      if (window.requestAnimationFrame) {
        window.requestAnimationFrame(function () { console.log('[splash] first-frame'); });
      }
    })();
  </script>
</body>
</html>
